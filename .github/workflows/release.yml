# Ninimma modification: independent installers, checksums and release publication.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  audit:
    uses: ./.github/workflows/security.yml
  validate:
    needs: [quality, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require tag to match package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
  linux:
    needs: validate
    runs-on: ${{ vars.NINIMMA_LOCAL_RUNNER == 'true' && 'ninimma-linux' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v7
      - run: bash packaging/ci/build-linux-release.sh "${GITHUB_REF_NAME}"
      - run: bash packaging/ci/install-smoke-test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            ninimma-linux-x64.tar.gz
            *.deb
            *.rpm
          if-no-files-found: error
          retention-days: 1
  windows:
    needs: validate
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      LLAMA_STATIC_CRT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: pwsh
        run: |
          $env:LIBCLANG_PATH = 'C:\Program Files\LLVM\bin'
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/ninimma.exe target/release/ninimma.exe
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $p = Start-Process -FilePath (Resolve-Path target/release/ninimma.exe) -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput target/release/version.txt
          if ($p.ExitCode -ne 0 -or (Get-Content target/release/version.txt -Raw).Trim() -ne "ninimma $version") { throw 'Built version check failed' }
      - name: Verify GUI subsystem and self-contained runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'dumpbin not found' }
          $deps = & $dumpbin /dependents target/release/ninimma.exe
          if ($LASTEXITCODE -ne 0) { throw 'Dependency inspection failed' }
          if ($deps -match '(VCRUNTIME|MSVCP|libcrypto|libssl|libgcc|libstdc\+\+|libwinpthread)') { throw "Unexpected external runtime: $deps" }
          $headers = & $dumpbin /headers target/release/ninimma.exe
          if ($LASTEXITCODE -ne 0 -or !($headers -match 'subsystem \(Windows GUI\)')) { throw 'Expected Windows GUI subsystem' }
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /NOCD packaging/windows/ninimma.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test ordinary-user install and uninstall
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Ninimma'
          $p = Start-Process -FilePath .\ninimma-windows-x64-setup.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          $p = Start-Process -FilePath "$installed\ninimma.exe" -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput "$env:TEMP\ninimma-installed-version.txt"
          if ($p.ExitCode -ne 0 -or (Get-Content "$env:TEMP\ninimma-installed-version.txt" -Raw).Trim() -ne (Get-Content target/release/version.txt -Raw).Trim()) { throw 'Installed version check failed' }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Ninimma\Ninimma.lnk")) { throw 'Shortcut missing' }
          $app = Start-Process -FilePath "$installed\ninimma.exe" -ArgumentList $env:TEMP -PassThru -RedirectStandardOutput "$env:TEMP\ninimma-out.log" -RedirectStandardError "$env:TEMP\ninimma-error.log"
          Start-Sleep -Seconds 8
          if ($app.HasExited) {
            Get-Content "$env:TEMP\ninimma-error.log"
            throw 'Installed GUI exited early'
          }
          taskkill /PID $app.Id /T /F | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'GUI cleanup failed' }
          $app.WaitForExit()
          $p = Start-Process -FilePath "$installed\Uninstall.exe" -ArgumentList '/S', "_?=$installed" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path "$installed\ninimma.exe") { throw 'App left after uninstall' }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ninimma-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 1
  macos:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: bash packaging/macos/build-dmg.sh '${{ matrix.target }}' '${{ matrix.arch }}'
      - run: bash packaging/macos/install-smoke-test.sh 'ninimma-macos-${{ matrix.arch }}.dmg'
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: '*.dmg'
          if-no-files-found: error
          retention-days: 1
  freebsd:
    needs: validate
    runs-on: ${{ vars.NINIMMA_LOCAL_RUNNER == 'true' && 'ninimma-freebsd' || 'ubuntu-latest' }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        release: ["14", "15"]
    steps:
      - uses: actions/checkout@v7
      - name: Check isolated runner readiness
        env:
          RUNNER_MIN_FREE_GB: "40"
        run: bash packaging/ci/check-runner.sh vm
      - uses: vmactions/freebsd-vm@v1
        id: freebsd_vm
        with:
          release: ${{ matrix.release }}
          cpu: 2
          data-dir: ${{ runner.temp }}/ninimma-freebsd-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.release }}
          disable-cache: true
          usesh: true
          copyback: false
          envs: GITHUB_REF_NAME
          prepare: |
            pkg install -y curl cmake llvm libX11 libxkbcommon libXcursor libXi libXrender mesa-libs xorg-vfbserver mesa-dri
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            . "$HOME/.cargo/env"
            export LIBCLANG_PATH=$(ls -d /usr/local/llvm*/lib | sort -V | tail -n 1)
            cfg=$(sh packaging/llama/patch-llama.sh)
            cargo build --locked --release --config "$cfg"
            sh packaging/freebsd/build-pkg.sh "${GITHUB_REF_NAME#v}" target/freebsd
            for f in target/freebsd/ninimma-*.pkg; do
              mv "$f" "${f%.pkg}-freebsd${{ matrix.release }}-amd64.pkg"
            done
            sh packaging/freebsd/install-smoke-test.sh
      - run: |
          mkdir -p target/freebsd
          scp "freebsd:${GITHUB_WORKSPACE}/target/freebsd/*.pkg" target/freebsd/
      - uses: actions/upload-artifact@v7
        with:
          name: freebsd-${{ matrix.release }}
          path: target/freebsd/*.pkg
          if-no-files-found: error
          retention-days: 1
      - name: Clean disposable FreeBSD build files
        if: always()
        env:
          VM_DATA_DIR: ${{ runner.temp }}/ninimma-freebsd-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.release }}
        run: |
          if [[ "${{ steps.freebsd_vm.outcome }}" != "skipped" ]]; then
            timeout 15s ssh -o BatchMode=yes -o ConnectTimeout=5 freebsd /sbin/shutdown -p now || true
          fi
          rm -rf -- target
          if [[ -d "$VM_DATA_DIR" ]]; then
            sudo -n rm -rf -- "$VM_DATA_DIR"
          fi
  publish:
    needs: [quality, audit, linux, windows, macos, freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: 'artifacts/*'
      - name: Verify every attestation before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in artifacts/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF"
          done
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "Ninimma $GITHUB_REF_NAME" --notes-file packaging/release-notes.txt
