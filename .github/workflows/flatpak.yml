# Ninimma modification: optional standalone Flatpak build, separate from native releases.
name: Flatpak
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the bundle to
        required: true
        type: string
permissions:
  contents: read
jobs:
  flatpak:
    runs-on: ${{ vars.NINIMMA_LOCAL_RUNNER == 'true' && 'ninimma-linux' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require matching packaging tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash packaging/flatpak/validate-release.sh "$RELEASE_TAG" "$GITHUB_REF"
      - run: sudo apt-get update && sudo apt-get install -y flatpak xvfb xauth dbus-x11
      - run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install maintained Flatpak Builder
        run: |
          flatpak install --user --noninteractive flathub org.flatpak.Builder
          flatpak run org.flatpak.Builder --version
      - name: Build with the SDK-compatible Builder
        run: |
          dbus-run-session -- flatpak run --filesystem="$GITHUB_WORKSPACE" --filesystem="$RUNNER_TEMP" org.flatpak.Builder \
            --user --disable-rofiles-fuse --force-clean --install-deps-from=flathub \
            --state-dir="$RUNNER_TEMP/ninimma-flatpak-state" --repo="$GITHUB_WORKSPACE/flatpak-repo" \
            "$GITHUB_WORKSPACE/target/flatpak" "$GITHUB_WORKSPACE/packaging/flatpak/io.github.tomblanchard312.ninimma.yml"
      - run: flatpak build-bundle flatpak-repo ninimma-linux-x64.flatpak io.github.tomblanchard312.ninimma --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - run: bash packaging/flatpak/install-smoke-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flatpak
          path: ninimma-linux-x64.flatpak
          if-no-files-found: error
          retention-days: 1
  attach:
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: flatpak
      - name: Checksum
        run: sha256sum ninimma-linux-x64.flatpak > ninimma-linux-x64.flatpak.sha256
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'ninimma-linux-x64.flatpak*'
      - name: Verify bundle and checksum attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in ninimma-linux-x64.flatpak*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/flatpak.yml" --source-ref "$GITHUB_REF"
          done
      - name: Attach bundle and checksum to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" ninimma-linux-x64.flatpak ninimma-linux-x64.flatpak.sha256
