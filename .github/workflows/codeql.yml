# Ninimma modification: scan source code and automation using GitHub CodeQL.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ${{ vars.NINIMMA_LOCAL_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ninimma-linux' || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Keep required check names present for documentation-only PRs.
      - name: Classify changed files
        id: changes
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_docs_only.py'
          python3 .github/scripts/docs_only.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.changes.outputs.docs_only != 'true' && matrix.language == 'rust'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: steps.changes.outputs.docs_only != 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          ram: 6144
          threads: 2
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: steps.changes.outputs.docs_only != 'true'
        with:
          category: '/language:${{ matrix.language }}'
