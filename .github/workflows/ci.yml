# Ninimma modification: independent GitHub-hosted validation.
name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Smaller debug artifacts make compilation and cache transfer cheaper.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  check:
    runs-on: ${{ vars.NINIMMA_LOCAL_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'ninimma-linux' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Identify compiler
        id: compiler
        shell: bash
        run: |
          echo "hash=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "CI_RUST_TOOLCHAIN=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"

      - name: Restore trusted build cache
        id: build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: ci-v1-ubuntu2204-linux-${{ steps.compiler.outputs.hash }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'build.rs', '.github/workflows/ci.yml', '.cargo/**', 'vendor/**', 'packaging/ci/**', 'packaging/llama/**') }}
          restore-keys: ci-v1-ubuntu2204-linux-${{ steps.compiler.outputs.hash }}-

      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config cmake clang libclang-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: Locate compiler builtin headers
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: python3 -m unittest discover -s packaging/linux
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features

      # PRs can read the default-branch cache, but never publish reusable build outputs.
      - name: Save trusted build cache
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
