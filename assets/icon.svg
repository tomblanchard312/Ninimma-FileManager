<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Ninimma app icon: a filing cabinet with its top drawer pulled open. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A5A70"/>
      <stop offset="0.5" stop-color="#5C6E86"/>
      <stop offset="1" stop-color="#435267"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F6FB"/>
      <stop offset="1" stop-color="#C9D4E2"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4657"/>
      <stop offset="1" stop-color="#1F2833"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0E1520" flood-opacity="0.4"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0E1520" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Cabinet body -->
  <rect x="44" y="20" width="168" height="220" rx="20" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="44" y="20" width="168" height="4" rx="2" fill="#FFFFFF" opacity="0.25"/>
  <!-- Dark recess the open drawer slides out of -->
  <rect x="58" y="34" width="140" height="92" rx="10" fill="#222B37"/>

  <!-- Folders standing in the open drawer -->
  <path d="M70 70 V44 Q70 38 76 38 H96 Q100 38 102 42 L104 46 H112 Q116 46 116 52 V70 Z" fill="#FFC94D"/>
  <path d="M102 70 V48 Q102 42 108 42 H128 Q132 42 134 46 L136 50 H150 Q154 50 154 56 V70 Z" fill="#4FA3F7"/>
  <path d="M140 70 V52 Q140 46 146 46 H162 Q166 46 168 50 L170 54 H180 Q186 54 186 60 V70 Z" fill="#6CCB8A"/>

  <!-- Open top drawer, pulled toward the viewer (slightly wider) -->
  <g filter="url(#soft)">
    <rect x="50" y="62" width="156" height="72" rx="12" fill="url(#drawer)"/>
  </g>
  <rect x="104" y="76" width="48" height="16" rx="3" fill="#FFFFFF" stroke="#8D9BB0" stroke-width="2.5"/>
  <rect x="98" y="104" width="60" height="13" rx="6.5" fill="url(#handle)"/>

  <!-- Closed bottom drawer -->
  <rect x="58" y="146" width="140" height="80" rx="12" fill="url(#drawer)"/>
  <rect x="104" y="160" width="48" height="16" rx="3" fill="#FFFFFF" stroke="#8D9BB0" stroke-width="2.5"/>
  <rect x="98" y="190" width="60" height="13" rx="6.5" fill="url(#handle)"/>
</svg>
