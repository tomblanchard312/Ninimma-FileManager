[graph]
all-features = true

[licenses]
include-dev = true
allow = [
    "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0",
    "CDLA-Permissive-2.0", "ISC", "MIT", "Unicode-3.0", "Unlicense", "Zlib",
]
# Bundled egui fonts also contain these font-specific licenses.
exceptions = [
    { name = "libfuzzer-sys", version = "=0.4.13", allow = ["NCSA"] },
    { name = "epaint_default_fonts", version = "=0.37.0", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
